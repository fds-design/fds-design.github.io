<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visualisation Idea Spinner</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    text-align: center;
    padding: 30px;
}

h1 {
    margin-bottom: 30px;
}

.container {
    display: flex;
    justify-content: center;
    gap: 30px;
    flex-wrap: wrap;
}

.spinner-box {
    background: white;
    padding: 20px;
    border-radius: 12px;
    width: 280px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}

.spinner-box h2 {
    margin-top: 0;
    font-size: 1.2em;
}

.result {
    margin: 20px 0;
    min-height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4em;
    font-weight: bold;
    border: 2px solid #ddd;
    border-radius: 8px;
    padding: 10px;
    background: #fafafa;
}

button {
    padding: 10px 20px;
    font-size: 1em;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    background: #0078d4;
    color: white;
}

button:hover {
    background: #005ea6;
}

.spin-all {
    margin-top: 30px;
    font-size: 1.2em;
    padding: 12px 30px;
}
</style>
</head>

<body>

<h1>🎲 Information Visualisation Idea Generator</h1>

<div class="container">

    <div class="spinner-box">
        <h2>Display Structure</h2>
        <div class="result" id="displayResult">Diagram</div>
        <button onclick="spin('display')">Spin</button>
    </div>

    <div class="spinner-box">
        <h2>Mark</h2>
        <div class="result" id="markResult">Point</div>
        <button onclick="spin('mark')">Spin</button>
    </div>

    <div class="spinner-box">
        <h2>Retinal Variable</h2>
        <div class="result" id="retinalResult">Position</div>
        <button onclick="spin('retinal')">Spin</button>
    </div>

</div>

<button class="spin-all" onclick="spinAll()">🎲 Spin All</button>

<script>

const displayOptions = [
    "Diagram",
    "Chart",
    "Map",
    "Symbol Collection",
    "Composite Display"
];

const markOptions = [
    "Point",
    "Line",
    "Area",
    "Shape",
    "Icon",
    "Picture"
];

const retinalOptions = [
    "Position",
    "Size",
    "Shape",
    "Hue",
    "Value",
    "Texture",
    "Orientation"
];

function animateSpin(elementId, options) {
    const element = document.getElementById(elementId);

    let count = 0;

    const interval = setInterval(() => {
        const random =
            options[Math.floor(Math.random() * options.length)];
        element.innerHTML = random;
        count++;

        if (count > 20) {
            clearInterval(interval);
            element.innerHTML =
                options[Math.floor(Math.random() * options.length)];
        }
    }, 50);
}

function spin(type) {

    if (type === "display")
        animateSpin("displayResult", displayOptions);

    if (type === "mark")
        animateSpin("markResult", markOptions);

    if (type === "retinal")
        animateSpin("retinalResult", retinalOptions);
}

function spinAll() {
    spin("display");
    spin("mark");
    spin("retinal");
}

</script>

</body>
</html>
